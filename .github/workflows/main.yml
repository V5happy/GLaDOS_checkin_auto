name: GLaDOS

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkin
        env:
          COOKIE: ${{ secrets.COOKIE }}
        run: curl -X POST https://glados.network/api/user/checkin -H "cookie: $COOKIE" -H "content-type: application/json;charset=UTF-8" -d '{"token": "glados.network"}'
