name: GLaDOS

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkin and Push
        env:
          COOKIE: ${{ GLADOS_COOKIE }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          curl -X POST https://glados.network/api/user/checkin -H "cookie: $COOKIE" -H "content-type: application/json;charset=UTF-8" -d '{"token": "glados.network"}'
          curl -s "http://www.pushplus.plus/send?token=$PUSHPLUS_TOKEN&title=GLaDOS_Checkin&content=GitHub_Actions_每日签到已运行"
